  <!-- Contact -->
  <main class="contact-page">
    <div class="contact-inner">

      <span class="contact-eyebrow reveal">Get in touch</span>

      <h1 class="contact-heading reveal reveal-delay-1">
        Let's work<br>together.
      </h1>

      <a
        href="mailto:hello@mauricecreates.com"
        class="contact-email reveal reveal-delay-2"
      >
        hello@mauricecreates.com
      </a>

      <div class="contact-divider reveal reveal-delay-2"></div>

      <div class="contact-social reveal reveal-delay-3">

        <a
          href="https://instagram.com/mauricecreates"
          target="_blank"
          rel="noopener"
          class="contact-social-link"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
          </svg>
          Instagram
        </a>

        <a
          href="https://tiktok.com/@mauricecreates"
          target="_blank"
          rel="noopener"
          class="contact-social-link"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.95a8.24 8.24 0 0 0 4.82 1.54V7.04a4.85 4.85 0 0 1-1.05-.35z"/>
          </svg>
          TikTok
        </a>
